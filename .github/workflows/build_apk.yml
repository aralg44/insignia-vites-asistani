name: Insignia OBD APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Android Izinlerini Ekle
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET" />\n\
            <uses-permission android:name="android.permission.BLUETOOTH" />\n\
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n\
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n\
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n\
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Paketleri Indir ve APK Derle
        run: |
          flutter pub get
          flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Insignia-1.6T-Vites-Asistani-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/app-release.apk
