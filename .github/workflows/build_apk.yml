name: Insignia OBD APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Proje Altyapisini ve Android Klasorunu Kur
        run: |
          # Ozel main.dart dosyamizi guvenceye alalim
          cp lib/main.dart /tmp/main_yedek.dart
          
          # Proje kok dizinini ve android klasorunu olusturalim
          flutter create --org com.insignia.asistan --project-name insignia_vites_asistani --overwrite .
          
          # Ozel main.dart dosyamizi geri tasiyalim
          cp /tmp/main_yedek.dart lib/main.dart
          
          # Android izinlerini ekleyelim
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.INTERNET" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n\
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Paketleri Indir ve APK Derle
        run: |
          flutter pub get
          flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Insignia-1.6T-Vites-Asistani-APK
          path: build/app/outputs/flutter-apk/app-release.apk
