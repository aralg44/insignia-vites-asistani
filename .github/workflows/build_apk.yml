name: Insignia OBD APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./insignia_asistan
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Kotlin Surumunu Sabitle ve Paketleri Indir
        run: |
          # android/build.gradle dosyasi varsa Kotlin surumunu guncelleyelim
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.20'/" android/build.gradle
          fi
          flutter pub get

      - name: APK Derle
        run: |
          flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Insignia-1.6T-Vites-Asistani-APK
          path: |
            insignia_asistan/build/app/outputs/flutter-apk/app-release.apk
            insignia_asistan/build/app/outputs/apk/release/app-release.apk
