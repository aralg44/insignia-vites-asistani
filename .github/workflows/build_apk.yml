name: Insignia OBD APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./insignia_asistan
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Android Altyapisini Kur ve Kotlin'i Sabitle
        run: |
          rm -rf android
          flutter create --platforms=android --org com.insignia.asistan --project-name insignia_vites_asistani .
          
          # android/build.gradle dosyasini dogrudan duzgun icerikle yeniden olusturalim
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # app/build.gradle icindeki kotlin versiyonunu garantiye alalim
          flutter pub get

      - name: APK Derle
        run: |
          flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Insignia-1.6T-Vites-Asistani-APK
          path: |
            insignia_asistan/build/app/outputs/flutter-apk/app-release.apk
            insignia_asistan/build/app/outputs/apk/release/app-release.apk
